[package]
name = "shvclient"
description = "A Rust framework for Silicon Heaven RPC devices"
license = "MIT"
repository = "https://github.com/silicon-heaven/libshvclient-rs"
version = "9.1.1"
edition = "2024"

[lib]
name = "shvclient"
path = "src/lib.rs"

[[example]]
name = "simple_device_tokio"
path = "examples/simple_device_tokio.rs"
required-features = ["tokio"]

[[example]]
name = "simple_device_smol"
path = "examples/simple_device_smol.rs"
required-features = ["smol"]

[[test]]
name = "ssl"
path = "tests/ssl.rs"

[dev-dependencies]
clap = { version = "4.4", features = ["derive"] }
simple_logger = { version = "5.0.0", features = ["stderr"] }
generics-alias = { git = "https://github.com/j4r0u53k/generics-alias-rs.git", branch = "main" }
shvbroker = "=3.32.9"
rcgen = "0.14.5"
tempfile = "3.23.0"
smol = "2.0.2"
anyhow = "1.0.100"

[dependencies]
shvproto = "7.0.0"
shvrpc = "19.0"
futures = "0.3.29"
futures-time = "3.0.0"
url = "2.4.1"
log = "0.4.20"
duration-str = "0.21"
async-broadcast = "0.7.1"
tokio = { version = "1.49.0", features = ["macros", "net", "rt-multi-thread", "time"], optional = true }
tokio-util = { version = "0.7.10", features = ["compat"], optional = true }
smol = { version = "2.0.2", optional = true }

# NOTE: macro_magic needs to be here as a direct dependency because some functions from
# there are called in expansion of `generics_inner` macro from generics-alias crate.
macro_magic = "0.6.0"

futures-rustls = "0.26.0"
rustls-pemfile = "2.2.0"
rustls-platform-verifier = "0.7.0"
async-trait = "0.1.89"
futures-timer = "3.0.3"
event-listener = { version = "5.4.1", optional = true }

# For local development
# [patch.crates-io]
# shvproto = { path = "../libshvproto-rs" }
# shvrpc = { path = "../libshvrpc-rs" }

[features]
default = []
tokio = ["dep:tokio", "dep:tokio-util"]
smol = ["dep:smol"]
mocking = ["dep:event-listener"]

[lints.clippy]
pedantic = {priority = -1, level = "warn"}

allow_attributes = "warn"
allow_attributes_without_reason = "warn"
box_collection = "warn"
dbg_macro = "warn"
enum_variant_names = "warn"
equatable_if_let = "warn"
exit = "warn"
indexing_slicing = "warn"
infinite_loop = "warn"
iter_on_single_items = "warn"
large_types_passed_by_value = "warn"
let_underscore_must_use = "warn"
linkedlist = "warn"
map_err_ignore = "warn"
missing_assert_message = "warn"
needless_pass_by_ref_mut = "warn"
option_if_let_else = "warn"
option_option = "warn"
or_fun_call = "warn"
owned_cow = "warn"
print_stderr = "warn"
print_stdout = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_allocation = "warn"
redundant_clone = "warn"
redundant_type_annotations = "warn"
ref_option = "warn"
rest_pat_in_fully_bound_structs = "warn"
return_and_then = "warn"
string_lit_as_bytes = "warn"
string_slice = "warn"
trivially_copy_pass_by_ref = "warn"
try_err = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unnecessary_box_returns = "warn"
unnecessary_wraps = "warn"
unneeded_field_pattern = "warn"
unwrap_used = "warn"
upper_case_acronyms = "warn"
useless_let_if_seq = "warn"
vec_box = "warn"
wrong_self_convention = "warn"

doc_markdown = "allow"
expect_used = "allow"
explicit_iter_loop = "allow"
float_cmp = "allow"
format_push_string = "allow"
items_after_statements = "allow"
manual_string_new = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
panic = "allow"
should_panic_without_expect = "allow"
struct_excessive_bools = "allow"
todo = "allow"
too_many_lines = "allow"
enum_glob_use = "allow"
unused_self = "allow"
