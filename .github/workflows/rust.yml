name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

permissions:
  # For syyyr/rust-pycobertura-action
  pull-requests: write

jobs:
  build:
    strategy:
      matrix:
        feature: ["tokio", "smol", "async_std"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clippy (${{ matrix.feature }})
        run: cargo clippy --all-targets --features ${{ matrix.feature }}
      - name: Build (${{ matrix.feature }})
        run: cargo build --all-targets --features ${{ matrix.feature }}
      - name: Run tests (${{ matrix.feature }})
        run: cargo test --all-targets --features ${{ matrix.feature }}

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    steps:
      - name: Generate coverage
        uses: syyyr/rust-pycobertura-action@v2.0.0
        with:
          project_name: libshvclient
          cargo_test_arguments: --features smol

  check-version-bump:
    name: Check version bump
    runs-on: ubuntu-latest
    steps:
      - name: Check version bump
        uses: syyyr/rust-check-version-bump@ed0644b33a4994450066d35f02905be30e80e627
